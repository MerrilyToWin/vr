<!-- VR Running Challenge View -->
<div id="view-root">
  <div class="position-relative w-100 h-100" style="min-height: 100%; height: 100%; overflow: hidden; background: #F8FAFC;">
    
    <!-- 2D HUD Overlay -->
    <div id="game-hud" class="vr-hud-overlay d-none">
      <div class="hud-pill" style="gap: 0.8rem; background: rgba(15, 76, 58, 0.82); border-color: rgba(255,255,255,0.24);">
        <span><strong id="hud-running-distance">0.0 m</strong></span>
        <span><strong id="hud-running-steps">0</strong> steps</span>
        <span><strong id="hud-running-time">01:30</strong></span>
      </div>
      <button id="btn-stop-running" class="btn btn-light border btn-circle shadow" style="pointer-events: auto; z-index: 100; background: white !important; width: 40px; height: 40px; display: inline-flex; align-items: center; justify-content: center;">
        <i data-lucide="arrow-left" style="width: 20px; height: 20px; color: var(--primary-color);"></i>
      </button>
    </div>

    <!-- Ready / Countdown Overlay Screen -->
    <div id="countdown-overlay" class="position-absolute top-0 start-0 w-100 h-100 d-flex flex-column align-items-center justify-content-center text-center text-white" style="z-index: 999; background: rgba(9, 13, 22, 0.95); padding: 2rem;">
      <div class="premium-card bg-transparent border-0 d-flex flex-column align-items-center">
        <div class="btn-circle mb-3" style="width: 72px; height: 72px; background: linear-gradient(135deg, #22C55E 0%, #10B981 100%); animation: pulseGlow 2s infinite;">
          <i data-lucide="footprints" style="width: 36px; height: 36px; color: white;"></i>
        </div>
        <h3 class="fw-bold mb-2">VR Running Challenge</h3>
        <p class="text-muted small mb-4" style="max-width: 350px;">
          Hold the phone securely and run in place to speed along the outdoor trail.
          <br><br>
          <strong>Desktop Controls:</strong> Press <strong>Spacebar</strong> to take running steps.
        </p>
        
        <!-- Big countdown number -->
        <h1 class="display-1 fw-bold text-gradient mb-4" id="countdown-number">10</h1>
        
        <p class="text-muted small mb-0">Get ready to run...</p>
      </div>
    </div>

    <!-- A-Frame VR Environment -->
    <!-- We remove embedded to ensure A-Frame applies proper fullscreen dimensions and aspect ratio for stereoscopic VR -->
    <a-scene vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
      
      <!-- Central Camera rig with look controls -->
      <a-entity id="camera-rig" position="0 1.6 0">
        <a-entity id="main-camera" camera look-controls wasd-controls="enabled: false">
          
          <!-- Gaze Reticle (thin dot in running for central gaze alignment) -->
          <a-entity id="gaze-cursor"
                    cursor="fuse: false"
                    position="0 0 -1"
                    geometry="primitive: ring; radiusInner: 0.005; radiusOuter: 0.008"
                    material="color: #cbd5e1; shader: flat; opacity: 0.4">
          </a-entity>

          <!-- Camera-attached HUD is rendered in both stereoscopic eyes. -->
        </a-entity>
      </a-entity>

      <!-- VR Environment Objects -->
      <!-- Colorful outdoor trail -->
      <a-sky color="#78c9f2"></a-sky>
      
      <!-- Stars container (twinkling dots in sky) -->
      <a-entity id="stars-container"></a-entity>

      <a-plane id="running-track" position="0 0.01 -50" rotation="-90 0 0" width="8" height="150" color="#c47b4e" material="roughness: 1.0;"></a-plane>
      <a-plane id="running-track-border-l" position="-4.05 0.02 -50" rotation="-90 0 0" width="0.12" height="150" color="#f4c95d" material="shader: flat;"></a-plane>
      <a-plane id="running-track-border-r" position="4.05 0.02 -50" rotation="-90 0 0" width="0.12" height="150" color="#f4c95d" material="shader: flat;"></a-plane>
      
      <!-- Scenery grid lines (scrolled to simulate motion) -->
      <a-entity id="scenery-container"></a-entity>

      <!-- Meadow and distant hills -->
      <a-plane position="0 -0.03 0" rotation="-90 0 0" width="1000" height="1000" color="#75a85b" material="roughness: 1.0;"></a-plane>
      <a-cone position="-18 5 -80" radius-bottom="24" radius-top="2" height="16" color="#4d8050" material="roughness: 1.0;"></a-cone>
      <a-cone position="20 6 -105" radius-bottom="28" radius-top="3" height="20" color="#5d8f56" material="roughness: 1.0;"></a-cone>
      <a-sphere position="-18 28 -70" radius="4" color="#ffd166" material="shader: flat; emissive: #f59e0b; emissiveIntensity: 0.25;"></a-sphere>

      <!-- Ambient Lighting -->
      <a-light type="ambient" color="#d9f0ff" intensity="0.85"></a-light>
      <a-light type="directional" color="#fff1b8" intensity="0.9" position="-10 24 -60"></a-light>
      <a-light type="directional" color="#b8e0ff" intensity="0.35" position="10 12 10"></a-light>
      
    </a-scene>
  </div>
</div>
