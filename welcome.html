<!-- Welcome & Onboarding View -->
<div id="view-root">
  <div class="view-content fade-in py-4 position-relative">
    <!-- Back Button -->
    <div class="position-absolute" style="top: 0.5rem; left: 0.5rem; z-index: 100;">
      <a href="#splash" class="btn btn-light btn-circle border shadow-soft" style="width: 40px; height: 40px; display: inline-flex; align-items: center; justify-content: center;">
        <i data-lucide="arrow-left" style="width: 20px; height: 20px; color: var(--primary-color);"></i>
      </a>
    </div>

    <!-- Intro Header -->
    <div class="text-center mb-4 mt-3">
      <span class="badge-accent mb-2" style="letter-spacing: 0.5px; text-transform: uppercase;">Immersive VR Tracker</span>
      <h2 class="fw-bold mb-1" style="letter-spacing: -0.5px;">Welcome to <span class="text-gradient">SYNOVA</span></h2>
      <p class="text-muted small px-3">Perform physical exercises using your smartphone's internal motion sensors to play VR fitness challenges.</p>
    </div>

    <!-- Feature Grid -->
    <div class="row g-3 mb-4">
      <div class="col-6">
        <div class="premium-card card-game-blue text-center p-3 h-100 d-flex flex-column align-items-center justify-content-center" style="border-radius: 20px;">
          <div class="btn-circle mb-2" style="background: rgba(99, 102, 241, 0.1) !important; border: 1px solid rgba(99, 102, 241, 0.15) !important;">
            <i data-lucide="target" style="width: 22px; height: 22px; color: var(--primary-color);"></i>
          </div>
          <h6 class="fw-bold mb-1" style="font-size: 0.85rem;">Catch Ball</h6>
          <p class="text-muted text-center mb-0" style="font-size: 0.72rem; line-height: 1.3;">Look at targets in VR to score points and combos.</p>
        </div>
      </div>
      
      <div class="col-6">
        <div class="premium-card card-game-green text-center p-3 h-100 d-flex flex-column align-items-center justify-content-center" style="border-radius: 20px;">
          <div class="btn-circle mb-2" style="background: rgba(16, 185, 129, 0.1) !important; border: 1px solid rgba(16, 185, 129, 0.15) !important;">
            <i data-lucide="footprints" style="width: 22px; height: 22px; color: var(--accent-green);"></i>
          </div>
          <h6 class="fw-bold mb-1" style="font-size: 0.85rem;">VR Running</h6>
          <p class="text-muted text-center mb-0" style="font-size: 0.72rem; line-height: 1.3;">Run in place to register distance and speed.</p>
        </div>
      </div>
    </div>

    <!-- User Information Form Card -->
    <div class="premium-card shadow-medium" data-aos="fade-up">
      <h5 class="fw-bold mb-4 d-flex align-items-center gap-2" style="font-size: 1.05rem;">
        <i data-lucide="user" style="color: var(--primary-color); width: 20px; height: 20px;"></i> Setup Athlete Profile
      </h5>
      
      <form id="onboarding-form">
        <!-- Full Name -->
        <div class="mb-3">
          <label for="user-name" class="form-label text-muted small fw-bold mb-1" style="font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.5px;">Full Name</label>
          <input type="text" id="user-name" class="premium-input" placeholder="e.g. John Doe" required>
        </div>

        <!-- Age & Gender -->
        <div class="row mb-3">
          <div class="col-6">
            <label for="user-age" class="form-label text-muted small fw-bold mb-1" style="font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.5px;">Age (years)</label>
            <input type="number" id="user-age" class="premium-input" min="10" max="100" placeholder="25" required>
          </div>
          <div class="col-6">
            <label for="user-gender" class="form-label text-muted small fw-bold mb-1" style="font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.5px;">Gender</label>
            <select id="user-gender" class="premium-input" style="height: 52px; padding: 0.5rem 1rem; cursor: pointer;" required>
              <option value="Male">Male</option>
              <option value="Female">Female</option>
              <option value="Other">Other</option>
            </select>
          </div>
        </div>

        <!-- Height & Weight -->
        <div class="row mb-4">
          <div class="col-6">
            <label for="user-height" class="form-label text-muted small fw-bold mb-1" style="font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.5px;">Height (cm)</label>
            <input type="number" id="user-height" class="premium-input" min="100" max="250" placeholder="175" required>
          </div>
          <div class="col-6">
            <label for="user-weight" class="form-label text-muted small fw-bold mb-1" style="font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.5px;">Weight (kg)</label>
            <input type="number" id="user-weight" class="premium-input" min="30" max="200" placeholder="70" required>
          </div>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="btn-premium w-100 py-3 mt-2">
          Start Training Session <i data-lucide="play-circle"></i>
        </button>
      </form>
    </div>
  </div>
</div>
